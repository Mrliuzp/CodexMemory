services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codex_memory}
      POSTGRES_USER: ${POSTGRES_USER:-codex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && python -m codex_memory.bootstrap --project-key \"$${CODEX_MEMORY_BOOTSTRAP_PROJECT_KEY}\" --project-name \"$${CODEX_MEMORY_BOOTSTRAP_PROJECT_NAME}\" --token \"$${CODEX_MEMORY_SERVICE_TOKEN}\" && uvicorn codex_memory.v1_app:app --host 0.0.0.0 --port 8000"]
    environment:
      CODEX_MEMORY_DATABASE_URL: ${CODEX_MEMORY_DATABASE_URL}
      CODEX_MEMORY_DEPLOYMENT_MODE: production
      CODEX_MEMORY_BOOTSTRAP_PROJECT_KEY: ${CODEX_MEMORY_BOOTSTRAP_PROJECT_KEY}
      CODEX_MEMORY_BOOTSTRAP_PROJECT_NAME: ${CODEX_MEMORY_BOOTSTRAP_PROJECT_NAME}
      CODEX_MEMORY_SERVICE_TOKEN: ${CODEX_MEMORY_SERVICE_TOKEN}
      CODEX_MEMORY_ADMIN_USERNAME: ${CODEX_MEMORY_ADMIN_USERNAME:-admin}
      CODEX_MEMORY_ADMIN_PASSWORD: ${CODEX_MEMORY_ADMIN_PASSWORD:-change-me-admin}
      CODEX_MEMORY_ADMIN_SESSION_SECRET: ${CODEX_MEMORY_ADMIN_SESSION_SECRET:-change-me-session-secret}
      CODEX_MEMORY_ADMIN_PROJECT_KEY: ${CODEX_MEMORY_ADMIN_PROJECT_KEY:-demo}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  admin-web:
    build: ./apps/admin-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      api:
        condition: service_healthy
  mcp:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "codex_memory.v1_mcp"]
    environment:
      CODEX_MEMORY_API_URL: http://api:8000
      CODEX_MEMORY_API_TOKEN: ${CODEX_MEMORY_SERVICE_TOKEN}
      CODEX_MEMORY_MCP_HOST: 0.0.0.0
      CODEX_MEMORY_MCP_PORT: 8001
      CODEX_MEMORY_MCP_TOKEN: ${CODEX_MEMORY_MCP_TOKEN}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "codex_memory.worker", "--schedule", "02:00"]
    environment:
      CODEX_MEMORY_DATABASE_URL: ${CODEX_MEMORY_DATABASE_URL}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
