services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codex_memory}
      POSTGRES_USER: ${POSTGRES_USER:-codex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn codex_memory.v1_app:app --host 0.0.0.0 --port 8000"]
    environment:
      CODEX_MEMORY_DATABASE_URL: ${CODEX_MEMORY_DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build: .
    command: ["python", "-m", "codex_memory.v1_mcp"]
    environment:
      CODEX_MEMORY_API_URL: http://api:8000
      CODEX_MEMORY_API_TOKEN: ${CODEX_MEMORY_SERVICE_TOKEN}
    ports:
      - "8001:8001"
    depends_on:
      - api

  worker:
    build: .
    command: ["python", "-m", "codex_memory.worker", "--schedule", "02:00"]
    environment:
      CODEX_MEMORY_DATABASE_URL: ${CODEX_MEMORY_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
