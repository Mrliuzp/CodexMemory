services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codex_memory}
      POSTGRES_USER: ${POSTGRES_USER:-codex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m codex_memory.bootstrap --project-key \"$${CODEX_MEMORY_BOOTSTRAP_PROJECT_KEY}\" --project-name \"$${CODEX_MEMORY_BOOTSTRAP_PROJECT_NAME}\" --token \"$${CODEX_MEMORY_SERVICE_TOKEN}\" && uvicorn codex_memory.v1_app:app --host 0.0.0.0 --port 8000"]
    environment:
      CODEX_MEMORY_DATABASE_URL: ${CODEX_MEMORY_DATABASE_URL}
      CODEX_MEMORY_BOOTSTRAP_PROJECT_KEY: ${CODEX_MEMORY_BOOTSTRAP_PROJECT_KEY}
      CODEX_MEMORY_BOOTSTRAP_PROJECT_NAME: ${CODEX_MEMORY_BOOTSTRAP_PROJECT_NAME}
      CODEX_MEMORY_SERVICE_TOKEN: ${CODEX_MEMORY_SERVICE_TOKEN}
      CODEX_MEMORY_ADMIN_USERNAME: ${CODEX_MEMORY_ADMIN_USERNAME:-admin}
      CODEX_MEMORY_ADMIN_PASSWORD: ${CODEX_MEMORY_ADMIN_PASSWORD:-lzp668505}
      CODEX_MEMORY_ADMIN_SESSION_SECRET: ${CODEX_MEMORY_ADMIN_SESSION_SECRET:-5EfJ4cZQlmDjRNLCunkIo093FTzBWOwA}
      CODEX_MEMORY_ADMIN_PROJECT_KEY: ${CODEX_MEMORY_ADMIN_PROJECT_KEY:-demo}
      IMPORT_STORAGE_BACKEND: ${IMPORT_STORAGE_BACKEND:-database}
      IMPORT_STORAGE_PATH: ${IMPORT_STORAGE_PATH:-/app/.codex-import-storage}
    volumes:
      - importdata:/app/.codex-import-storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  admin-web:
    build: ./apps/admin-web
    ports:
      - "5175:80"
    depends_on:
      api:
        condition: service_healthy
  mcp:
    build: .
    command: ["python", "-m", "codex_memory.v1_mcp"]
    environment:
      CODEX_MEMORY_API_URL: http://api:8000
      CODEX_MEMORY_API_TOKEN: ${CODEX_MEMORY_SERVICE_TOKEN}
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "codex_memory.worker", "--mode", "async", "--poll-interval", "2", "--reflection-schedule", "02:00"]
    environment:
      CODEX_MEMORY_DATABASE_URL: ${CODEX_MEMORY_DATABASE_URL}
      CODEX_MEMORY_WORKER_ROLE: async
      CODEX_MEMORY_WORKER_LEASE_SECONDS: 60
      CODEX_MEMORY_WORKER_HEARTBEAT_SECONDS: 20
      CODEX_MEMORY_WORKER_BATCH_SIZE: 10
      IMPORT_STORAGE_BACKEND: ${IMPORT_STORAGE_BACKEND:-database}
      IMPORT_STORAGE_PATH: ${IMPORT_STORAGE_PATH:-/app/.codex-import-storage}
    volumes:
      - importdata:/app/.codex-import-storage
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  importdata:
