[project]
name = "codex-memory-system"
version = "0.1.0"
description = "面向 Codex 智能体的项目级分层记忆与 RAG 上下文构建器。"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.139,<1",
    "httpx>=0.28,<1",
    "mcp>=1.28,<2",
    "pgvector>=0.3,<1",
    "python-multipart>=0.0.20,<1",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6,<7",
    "pypdf>=5,<6",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.51,<1",
]

[project.scripts]
codex-memory = "codex_memory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
